<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — SmartReach AI</title>
    <meta name="theme-color" content="#0B5D3B" />
    <style>
      :root { color-scheme: dark light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: radial-gradient(120% 80% at 50% 0%, #0F3D2A 0%, #06110C 60%, #000 100%);
        color: #F4EFE6; padding: 24px;
      }
      .card {
        max-width: 460px; width: 100%; text-align: center;
        background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        border-radius: 20px; padding: 40px 28px;
      }
      .logo {
        width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 18px;
        background: linear-gradient(135deg, #10B981, #0B5D3B);
        display: grid; place-items: center; font-weight: 800; font-size: 32px; color: #F4EFE6;
        box-shadow: 0 8px 24px rgba(16,185,129,0.35);
      }
      h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.01em; }
      p { margin: 0 0 20px; color: #C9C4B8; line-height: 1.55; font-size: 15px; }
      button {
        display: inline-block; padding: 12px 20px; border-radius: 12px; border: 0;
        background: #10B981; color: #04120B; font-weight: 700; font-size: 15px; cursor: pointer;
        transition: transform .15s ease, background .15s ease;
      }
      button:hover { background: #34D399; transform: translateY(-1px); }
      .hint { margin-top: 16px; font-size: 13px; color: #8F8B82; }
      .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#EF4444; margin-right:6px; vertical-align: middle; animation: pulse 1.4s infinite; }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">S</div>
      <h1><span class="dot"></span>You're offline</h1>
      <p>SmartReach can't reach the network right now. Cached pages and queued actions still work — anything you do will sync automatically when you're back online.</p>
      <button onclick="location.reload()">Try again</button>
      <div class="hint">Uko offline. Vitendo vyako vitatumwa mtandao ukirudi.</div>
    </div>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
